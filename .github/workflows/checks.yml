name: Collaborator checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rera_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: rera_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rera_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://rera_test:local_test_only@localhost:5432/rera_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt -r db_schema/agents/requirements-agents.txt
      - run: python -m pip check
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests -q
