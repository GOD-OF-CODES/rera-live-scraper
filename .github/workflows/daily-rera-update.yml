name: Daily UP-RERA update

on:
  schedule:
    # 00:30 UTC = 06:00 Asia/Kolkata, every day.
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compare without changing the database'
        type: boolean
        default: true
      limit:
        description: 'Number of projects to check (0 = every indexed project)'
        type: string
        default: '0'

permissions:
  contents: read

concurrency:
  group: daily-rera-database-update
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install tested scraper dependencies
        run: python -m pip install -r requirements.txt
      - name: Check source and update Neon
        env:
          RERA_DATABASE_URL: ${{ secrets.RERA_UPDATER_DATABASE_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          LIMIT: ${{ inputs.limit || '0' }}
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          if [ -z "$RERA_DATABASE_URL" ]; then
            echo 'Missing RERA_UPDATER_DATABASE_URL repository secret.'
            exit 1
          fi
          args=(--workers 4 --max-minutes 150 --limit "$LIMIT")
          if [ "$DRY_RUN" = 'true' ]; then args+=(--dry-run); fi
          python -m scripts.update_rera_database "${args[@]}"
      - name: Publish run summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('data/daily_update_report.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              if not path.exists():
                  summary.write('The updater did not produce a report. See the failed step.\n')
              else:
                  r = json.loads(path.read_text())
                  summary.write('## UP-RERA morning check\n\n')
                  for key in ['status', 'dry_run', 'known_projects', 'selected', 'attempted', 'changed', 'created',
                              'unchanged', 'index_updated', 'failed', 'unattempted', 'stop_reason']:
                      summary.write(f'- {key}: {r.get(key)}\n')
                  summary.write('\nScope: existing indexed projects; document links, not PDF binary contents.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rera-update-report-${{ github.run_id }}
          path: data/daily_update_report.json
          if-no-files-found: ignore
          retention-days: 14
